# ExcaliDash — excalidash.loftos.io
#
# Install:
#   sudo cp excalidash.loftos.io.conf /etc/apache2/sites-available/
#   sudo a2enmod ssl proxy proxy_http proxy_wstunnel headers rewrite
#   sudo a2ensite excalidash.loftos.io
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# (On RHEL/CentOS: drop into /etc/httpd/conf.d/ — modules are usually built in.)

<VirtualHost *:80>
    ServerName excalidash.loftos.io

    # Keep ACME HTTP-01 renewals working, redirect everything else.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/excalidash-error.log
    CustomLog ${APACHE_LOG_DIR}/excalidash-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName excalidash.loftos.io

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/loftos.io/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/loftos.io/privkey.pem

    # Pass the original Host through so the app builds correct URLs.
    ProxyPreserveHost On
    # Never act as a forward proxy.
    ProxyRequests Off

    # mod_proxy sets X-Forwarded-For/-Host itself, but NOT X-Forwarded-Proto.
    # The backend needs it: without it ENFORCE_HTTPS_REDIRECT sends browsers
    # into an infinite redirect loop.
    RequestHeader set X-Forwarded-Proto "https"

    # HSTS. The app's own nginx already sets CSP, X-Frame-Options,
    # X-Content-Type-Options, Referrer-Policy and Permissions-Policy —
    # don't duplicate those here.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Socket.IO starts as HTTP long-polling and only then upgrades, so both
    # transports share /socket.io/. Route by the Upgrade header rather than by
    # path: a blanket ws:// ProxyPass on /socket.io/ would break the polling
    # handshake and collaboration would silently fall back to nothing.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:6767/$1" [P,L]

    # Everything else (SPA, /api/, Socket.IO polling) to the frontend container.
    ProxyPass        / http://127.0.0.1:6767/
    ProxyPassReverse / http://127.0.0.1:6767/

    # Long-lived WebSocket connections; matches the app nginx's 3600s.
    ProxyTimeout 3600

    # Backend accepts image uploads up to 100MB (FILE_UPLOAD_MAX_MB); leave headroom.
    LimitRequestBody 115343360

    ErrorLog  ${APACHE_LOG_DIR}/excalidash-error.log
    CustomLog ${APACHE_LOG_DIR}/excalidash-access.log combined
</VirtualHost>
</IfModule>
